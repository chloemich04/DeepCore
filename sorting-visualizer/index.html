<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Deepcore</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>Deepcore</h1>
        <div id="main-content">
            <div>
                <div id="algo-buttons">
                    <button data-algo="bubble" class="algo-btn selected">Bubble Sort</button>
                    <button data-algo="insertion" class="algo-btn">Insertion Sort</button>
                    <button data-algo="selection" class="algo-btn">Selection Sort</button>
                </div>
                <div id="controls">
                    <button id="start-btn">Start Sort</button>
                    <button id="reset-btn">Reset Array</button>
                </div>
                <div id="array-container"></div>
            </div>
            <pre id="code-block"></pre>
        </div>
        <script src="main.js"></script>
    </body>
</html>
