<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Sorting Visualizer</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>Sorting Visualizer</h1>
        <div id="main-content" style="display: flex; justify-content: center; align-items: flex-start;">
            <div>
                <div id="array-container"></div>
                <button id="start-btn">Start Bubble Sort</button>
                <button id="reset-btn">Reset Array </button>
            </div>
            <pre id="code-block" style="margin-left: 40px; background: #222; color: #fff; padding: 20px; border-radius: 8px;  min-width: 350px; text-align: left;"></pre>
        </div>
        <script src="main.js"></script>
    </body>
</html>
